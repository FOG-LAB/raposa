apiVersion: apps/v1
kind: Deployment
metadata:
  name: raposa
  namespace: raposa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raposa
  template:
    metadata:
      labels:
        app: raposa
    spec:
      containers:
        - name: raposa
          image: kampov/pagina-da-raposa:1.1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: raposa-svc
  namespace: raposa
spec:
  selector:
    app: raposa
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
